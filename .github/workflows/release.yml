name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag with locally tested release assets
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    if: github.event_name == 'release' && !contains(github.event.release.body, '[local-artifacts]')
    name: Build and publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/proxyrequest-sdk
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run python scripts/verify_release.py
        env:
          GITHUB_REF_NAME: ${{ github.event.release.tag_name }}
      - run: make quality generate-check build
      - uses: actions/upload-artifact@v7
        with:
          name: release-distributions
          path: dist/
          if-no-files-found: error
      - name: Publish distribution
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          print-hash: true

  publish-local-artifacts:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download locally tested release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*' --dir dist
      - name: Publish locally tested distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          print-hash: true
